<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jogos do chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho com os dois times, palco grande à esquerda e painel do chat à direita */
:root{
  --bg:#131118; --surface:#1c1923; --surface2:#262230; --line:#342f41;
  --fg:#f6f3fa; --muted:#a49fb3;
  --blue:#3a7bff; --green:#16b364;
  --ok:#3ddc97; --warn:#ffc53d; --bad:#ff5d6c;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--display);min-height:100vh;
  padding-block:24px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
.t-azul{--tc:var(--blue)} .t-verde{--tc:var(--green)}
.wrap{max-width:1320px;margin:0 auto}

/* topo */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.pills{display:flex;flex-wrap:wrap;gap:12px}
.pill{border:0;border-radius:999px;padding:9px 20px;font-weight:600;font-size:15px;color:#fff;background:var(--tc);display:flex;gap:10px;align-items:center;cursor:pointer}
.pill b{background:rgba(0,0,0,.22);border-radius:999px;padding:0 9px;font-variant-numeric:tabular-nums}
.score{display:flex;gap:10px;align-items:stretch}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px;min-width:110px}
.sc small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.sc strong{font-size:26px;font-weight:800;color:var(--tc);font-variant-numeric:tabular-nums;line-height:1.1}
.sc em{font-style:normal;color:var(--muted);font-size:13px;margin-left:6px}

.hero{padding-block:34px 22px}
.hero h1{margin:0;font-size:clamp(38px,6vw,68px);line-height:1;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
.hero p{margin:12px 0 0;color:var(--muted);font-size:clamp(16px,2vw,20px);max-width:60ch}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.layout.solo{grid-template-columns:minmax(0,1fr)}
.layout.solo .panel{display:none}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;min-height:540px;min-width:0}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.box h3{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row+.row{margin-top:8px}
input[type=text],select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;flex:1}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.main{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.pill:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.status{font-size:13px;color:var(--muted)}
.status.on{color:var(--ok)}
.feed{height:250px;overflow:auto;font-size:14px;display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-weight:500}
.feed div{overflow-wrap:anywhere}
.feed b{color:var(--tc,var(--muted))}

/* blocos comuns do palco */
.eyebrow{color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.big{font-size:clamp(28px,4vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:6px 0 0;text-wrap:balance}
.lead{color:var(--muted);margin:10px 0 0;max-width:62ch}
.timer{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-block:16px}
.timer i{display:block;height:100%;background:var(--fg);width:100%}
.msg{margin-top:14px;min-height:28px;font-weight:600;font-size:18px}
.cmds{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.cmds code{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-family:var(--mono);font-size:14px}

/* votação */
.opts{display:grid;gap:10px;margin-top:18px}
.opt{position:relative;overflow:hidden;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.opt i{position:absolute;inset:0 auto 0 0;width:0;background:rgba(246,243,250,.12);transition:width .3s}
.opt span,.opt b{position:relative}
.opt span{font-weight:800;font-size:22px}
.opt small{color:var(--muted);font-family:var(--mono);margin-left:10px;font-size:13px}
.opt.win{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.opt b{font-variant-numeric:tabular-nums;font-size:20px}

/* forca */
.fgrid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:26px;margin-top:10px}
.gallows{width:100%;max-width:220px}
.gallows .g{stroke:var(--muted);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hp{stroke:var(--fg);stroke-width:5;fill:none;stroke-linecap:round;opacity:0;transition:opacity .2s}
.hp.on{opacity:1}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.slot{width:clamp(30px,5vw,48px);height:clamp(42px,7vw,60px);border-bottom:4px solid var(--muted);display:grid;place-items:end center;font-size:clamp(26px,4.5vw,40px);font-weight:800;padding-bottom:2px}
.slot.miss{color:var(--bad)}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:20px}
.key{background:var(--surface2);border-radius:8px;text-align:center;padding:6px 0;font-weight:600}
.key.ok{background:var(--ok);color:#06240f}
.key.no{background:transparent;color:var(--muted);text-decoration:line-through;opacity:.6}

/* bingo */
.bhead{display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin-top:8px}
.ball{width:120px;height:120px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;text-align:center;line-height:1;flex:none}
.ball small{font-size:20px;font-weight:800;display:block}
.ball strong{font-size:54px;font-weight:800}
.recent{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface2);border-radius:99px;padding:4px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.chip.now{background:var(--warn);color:#2b2000}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:22px}
.bcard{background:var(--surface2);border-radius:16px;padding:12px;border:2px solid var(--tc)}
.bcard h4{margin:0 0 8px;color:var(--tc);font-size:16px}
.bg5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.bg5 div{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums}
.bg5 .l{background:transparent;color:var(--tc);font-weight:800;aspect-ratio:auto}
.bg5 .m{background:var(--tc);color:#fff}
.bg5 .hot{outline:3px solid var(--warn);animation:pulse .8s infinite alternate}
.bg5 .line{box-shadow:0 0 0 3px var(--warn)}
@keyframes pulse{to{background:rgba(255,197,61,.28)}}

/* corrida */
.lane{position:relative;height:84px;background:var(--surface2);border-radius:16px;margin-top:16px;overflow:hidden}
.lane::after{content:"";position:absolute;right:0;top:0;bottom:0;width:22px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/11px 11px}
.lane .name{position:absolute;left:14px;top:8px;font-size:13px;font-weight:600;color:var(--tc);letter-spacing:.05em;text-transform:uppercase}
.car{position:absolute;left:0;bottom:12px;width:88px;height:34px;background:var(--tc);border-radius:10px 22px 8px 8px;transition:left .25s linear}
.car::before{content:"";position:absolute;left:24px;top:-15px;width:34px;height:18px;background:var(--tc);border-radius:10px 14px 0 0;filter:brightness(1.2)}
.car::after{content:"";position:absolute;left:10px;bottom:-7px;width:16px;height:16px;border-radius:50%;background:#111;box-shadow:46px 0 0 #111,0 0 0 3px var(--surface2),46px 0 0 3px var(--surface2)}
.laneinfo{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:6px;font-variant-numeric:tabular-nums}
.nitro{margin-top:16px;padding:12px 16px;border-radius:12px;background:var(--warn);color:#2b2000;font-weight:800;font-size:22px;text-align:center}

/* geo */
.ggrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;margin-top:10px}
.map{width:100%;background:#15121c;border-radius:16px;border:1px solid var(--line);display:block}
.map .land{fill:#3a3548;stroke:#4a4460;stroke-width:.4}
.map .gl{stroke:#2a2536;stroke-width:.3}
.map circle{fill:var(--warn);stroke:#fff;stroke-width:1}
.map .ring{fill:none;stroke:var(--warn);stroke-width:1;animation:ping 1.4s infinite}
@keyframes ping{from{r:3;opacity:1}to{r:14;opacity:0}}
.hints{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hints li{background:var(--surface2);border-radius:12px;padding:11px 14px;min-height:48px}
.hints li.off{color:var(--muted);opacity:.5}
.hints li small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}

/* trivia */
.q{font-size:clamp(22px,3vw,34px);font-weight:800;line-height:1.15;margin:8px 0 0;text-wrap:balance}
.tq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
.to{position:relative;overflow:hidden;background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:16px 18px;font-weight:600;font-size:19px;display:flex;gap:12px;align-items:center}
.to i{position:absolute;inset:0 auto 0 0;width:0;background:rgba(246,243,250,.13);transition:width .4s}
.to em{font-style:normal;position:relative;background:var(--fg);color:var(--bg);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;flex:none}
.to span{position:relative;flex:1}
.to b{position:relative;font-variant-numeric:tabular-nums;color:var(--muted)}
.to.right{border-color:var(--ok)}
.to.wrong{opacity:.45}

/* resultado */
.res{text-align:center;padding-block:40px}
.res .big{color:var(--tc,var(--fg))}
.res ul{list-style:none;padding:0;margin:22px 0 0;color:var(--muted)}

@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .fgrid,.ggrid{grid-template-columns:minmax(0,1fr)}
  .tq,.cards{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="pills">
      <button class="pill t-azul" id="pillAzul" type="button" title="Digite !azul no chat">Time Azul <b id="cntAzul">0</b></button>
      <button class="pill t-verde" id="pillVerde" type="button" title="Digite !verde no chat">Time Verde <b id="cntVerde">0</b></button>
    </div>
    <div class="score" aria-label="Placar">
      <div class="sc t-azul"><small>Azul</small><strong id="scAzul">0</strong><em id="wnAzul">0 vitórias</em></div>
      <div class="sc t-verde"><small>Verde</small><strong id="scVerde">0</strong><em id="wnVerde">0 vitórias</em></div>
    </div>
  </header>

  <section class="hero">
    <h1>Jogos do chat</h1>
    <p id="sub">Nos intervalos da live, o chat joga em dois times</p>
  </section>

  <main class="layout" id="layout">
    <section class="stage" id="stage" aria-live="polite"></section>

    <aside class="panel" id="panel">
      <div class="box">
        <h3>Chat da live</h3>
        <div class="row">
          <input type="text" id="canal" placeholder="canal da Twitch" autocomplete="off" spellcheck="false">
          <button class="btn main" id="btnConnect" type="button">Conectar</button>
        </div>
        <div class="status" id="status" style="margin-top:8px">Desconectado</div>
      </div>

      <div class="box">
        <h3>Controle</h3>
        <div class="row">
          <button class="btn main" id="btnVote" type="button">Votar jogo</button>
          <button class="btn" id="btnStop" type="button">Parar</button>
        </div>
        <div class="row">
          <select id="selGame" aria-label="Jogo"></select>
          <button class="btn" id="btnForce" type="button">Iniciar</button>
        </div>
        <div class="row" style="margin-top:12px">
          <label class="chk"><input type="checkbox" id="chkAuto" checked> Votar de novo ao fim de cada jogo</label>
        </div>
        <div class="row">
          <label class="chk"><input type="checkbox" id="chkSim"> Simular chat (teste)</label>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn" id="btnReset" type="button">Zerar placar e times</button>
          <button class="btn" id="btnHide" type="button">Esconder painel</button>
        </div>
      </div>

      <div class="box">
        <h3>Mensagens</h3>
        <div class="feed" id="feed"></div>
        <form class="row" id="manual" style="margin-top:10px">
          <input type="text" id="mUser" value="voce" aria-label="Nome" style="max-width:84px">
          <input type="text" id="mText" placeholder="testar mensagem" aria-label="Mensagem" autocomplete="off">
        </form>
      </div>
    </aside>
  </main>
</div>
<script>
'use strict';
/* ===== utilitários ===== */
const $ = (s, r = document) => r.querySelector(s);
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rand = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
};

/* ===== estado ===== */
const TEAMS = { azul: 'Time Azul', verde: 'Time Verde' };
const S = {
  users: {}, score: { azul: 0, verde: 0 }, wins: { azul: 0, verde: 0 }, gp: { azul: 0, verde: 0 },
  mode: 'idle', game: null, auto: true, vote: null, sim: false, resultEnd: 0
};
const G = {};               // registro dos jogos
const stage = $('#stage');
const VOTE_MS = 25000;
const DEFAULT_SUB = 'Nos intervalos da live, o chat joga em dois times';

function getUser(name) {
  const k = String(name).toLowerCase();
  return S.users[k] || (S.users[k] = { name: String(name), team: null, pts: 0, gpts: 0 });
}
function counts() {
  const c = { azul: 0, verde: 0 };
  for (const k in S.users) { const t = S.users[k].team; if (t) c[t]++; }
  return c;
}
function updPills() { const c = counts(); $('#cntAzul').textContent = c.azul; $('#cntVerde').textContent = c.verde; }
function updScore() {
  $('#scAzul').textContent = S.score.azul; $('#scVerde').textContent = S.score.verde;
  $('#wnAzul').textContent = S.wins.azul + (S.wins.azul === 1 ? ' vitória' : ' vitórias');
  $('#wnVerde').textContent = S.wins.verde + (S.wins.verde === 1 ? ' vitória' : ' vitórias');
}
function teamOf(u) {
  if (!u.team) {
    const c = counts();
    u.team = c.azul < c.verde ? 'azul' : c.verde < c.azul ? 'verde' : rand(['azul', 'verde']);
    updPills();
  }
  return u.team;
}
function award(u, pts) {
  const t = teamOf(u);
  u.pts += pts; u.gpts += pts; S.score[t] += pts; S.gp[t] += pts; updScore();
  return t;
}
function setSub(t) { $('#sub').textContent = t || DEFAULT_SUB; }

/* ===== feed ===== */
function feed(u, text) {
  const box = $('#feed');
  const d = document.createElement('div');
  if (u.team) d.className = 't-' + u.team;
  d.innerHTML = '<b>' + esc(u.name) + '</b> ' + esc(text);
  box.appendChild(d);
  while (box.children.length > 60) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

/* ===== entrada de mensagens do chat ===== */
function handle(name, text) {
  text = String(text || '').trim();
  if (!text || text.charCodeAt(0) === 1) return;
  const u = getUser(name);
  const n = norm(text);
  if (n === '!azul' || n === '!verde' || ((S.mode === 'idle' || S.mode === 'vote') && (n === 'azul' || n === 'verde'))) {
    const t = n.replace('!', '');
    if (!u.team || S.mode === 'idle' || S.mode === 'vote') { u.team = t; updPills(); }
    feed(u, text);
    return;
  }
  feed(u, text);
  if (S.mode === 'vote') voteMsg(u, n);
  else if (S.mode === 'game' && S.game) S.game.onMsg(u, text, n);
}
window.chatMsg = handle;

/* ===== conexão com o chat da Twitch (leitura anônima) ===== */
let ws = null, wantConn = false;
function setStatus(t, on) { const s = $('#status'); s.textContent = t; s.className = 'status' + (on ? ' on' : ''); }
function connect(ch) {
  ch = String(ch || '').replace(/^#/, '').toLowerCase().trim();
  if (!ch) { setStatus('Digite o nome do canal'); return; }
  wantConn = true; store.set('canal', ch);
  if (ws) { try { ws.onclose = null; ws.close(); } catch (e) { } }
  setStatus('Conectando em #' + ch + '...');
  ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags');
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));
    ws.send('JOIN #' + ch);
  };
  ws.onmessage = e => {
    String(e.data).split('\r\n').forEach(line => {
      if (!line) return;
      if (line.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); return; }
      if (line.indexOf(' 366 ') > -1 || line.indexOf(' JOIN #') > -1) setStatus('Conectado em #' + ch, true);
      const m = line.match(/^(?:@(\S+) )?:([^!]+)![^ ]+ PRIVMSG #\S+ :(.*)$/);
      if (m) {
        let name = m[2];
        const dn = (m[1] || '').match(/display-name=([^;]*)/);
        if (dn && dn[1]) name = dn[1].replace(/\\s/g, ' ');
        handle(name, m[3]);
      }
    });
  };
  ws.onerror = () => setStatus('Erro na conexão');
  ws.onclose = () => { if (wantConn) { setStatus('Reconectando...'); setTimeout(() => wantConn && connect(ch), 3000); } else setStatus('Desconectado'); };
}

/* ===== fluxo: parado, votação, jogo, resultado ===== */
const OPTS = [['forca', 'Forca'], ['bingo', 'Bingo'], ['corrida', 'Corrida'], ['geo', 'Geo'], ['trivia', 'Trivia']];
const ALIAS = { forca: 'forca', bingo: 'bingo', corrida: 'corrida', geo: 'geo', geoguesser: 'geo', trivia: 'trivia', quiz: 'trivia', 1: 'forca', 2: 'bingo', 3: 'corrida', 4: 'geo', 5: 'trivia' };

function goIdle() {
  stopGame(); S.mode = 'idle'; S.vote = null; setSub();
  stage.innerHTML = `
    <div class="eyebrow">Aguardando</div>
    <h2 class="big">Quem vai escolher o jogo é o chat</h2>
    <p class="lead">Entre em um time digitando <b>!azul</b> ou <b>!verde</b>. Quem jogar sem escolher entra no time com menos gente.</p>
    <div class="cmds"><code>!azul</code><code>!verde</code></div>
    <div class="row" style="margin-top:22px"><button class="btn main" type="button" id="goVote">Abrir votação</button></div>`;
  $('#goVote').onclick = startVote;
}

function startVote() {
  stopGame(); S.mode = 'vote'; setSub('Digite o nome do jogo no chat para votar');
  S.vote = { end: Date.now() + VOTE_MS, votes: {}, done: null, doneAt: 0 };
  stage.innerHTML = `
    <div class="eyebrow">Votação</div>
    <h2 class="big">Qual jogo vai ser agora?</h2>
    <p class="lead">Vale o último voto de cada pessoa. Dá para votar pelo nome ou pelo número.</p>
    <div class="timer"><i id="vTimer"></i></div>
    <div class="opts">${OPTS.map(([id, nome], i) => `

function voteMsg(u, n) {
  if (!S.vote || S.vote.done) return;

  S.vote.votes[u.name.toLowerCase()] = key;
  renderVote();
}
function tally() {
  const c = {}; OPTS.forEach(([id]) => c[id] = 0);
  Object.values(S.vote.votes).forEach(v => c[v]++);
  return c;
}
function renderVote() {
  const c = tally(), max = Math.max(1, ...Object.values(c));
  stage.querySelectorAll('.opt').forEach(el => {
    const id = el.dataset.id;
    el.querySelector('b').textContent = c[id];
    el.querySelector('i').style.width = (c[id] / max * 100) + '%';
    el.classList.toggle('win', S.vote.done === id);
  });
}
function voteTick(now) {
  const v = S.vote; if (!v) return;
  if (!v.done) {
    const left = Math.max(0, v.end - now);
    const t = $('#vTimer'); if (t) t.style.width = (left / VOTE_MS * 100) + '%';
    if (left > 0) return;
    const c = tally(), max = Math.max(...Object.values(c));
    v.done = rand(OPTS.filter(([id]) => c[id] === max)).at(0);
    v.doneAt = now + 2500;
    renderVote();

function startGame(id) {

G.bingo = {
  nome: 'Bingo',
  desc: 'Cada time tem uma cartela. Digite no chat o número que acabou de sair e ele é marcado.',
  WINDOW: 4, EVERY: 4200,
  mk() {
    const cols = [0, 1, 2, 3, 4].map(c => shuffle(range(c * 15 + 1, c * 15 + 15)).slice(0, 5));
    const n = [0, 1, 2, 3, 4].map(r => [0, 1, 2, 3, 4].map(c => cols[c][r]));
    const m = n.map(row => row.map(() => false));
    n[2][2] = 0; m[2][2] = true;
    return { n, m };
  },
  start() {
    this.pool = shuffle(range(1, 75)); this.drawn = []; this.over = false; this.pause = 0; this.winLine = null;
    this.cards = { azul: this.mk(), verde: this.mk() };
    this.nextDraw = Date.now() + 2500;
    stage.innerHTML = `
      <div class="bhead">
        <div class="ball" id="bBall"><div><small>&nbsp;</small><strong>—</strong></div></div>
        <div>
          <div class="eyebrow">Números recentes</div>
          <div class="recent" id="bRecent" style="margin-top:8px"></div>
          <div class="msg" id="bMsg">Digite só o número, por exemplo 37. Vale para os 4 últimos sorteados.</div>
        </div>
      </div>
      <div class="cards" id="bCards"></div>`;
    this.draw();
  },
  letter(n) { return 'BINGO'[Math.floor((n - 1) / 15)]; },
  recentSet() { return this.drawn.slice(-this.WINDOW); },
  draw() {
    const last = this.drawn[this.drawn.length - 1], rec = this.recentSet();
    if (last) $('#bBall').innerHTML = `<div><small>${this.letter(last)}</small><strong>${last}</strong></div>`;
    $('#bRecent').innerHTML = rec.slice().reverse().map((n, i) => `<span class="chip ${i === 0 ? 'now' : ''}">${this.letter(n)}${n}</span>`).join('');
    $('#bCards').innerHTML = ['azul', 'verde'].map(t => {
      const c = this.cards[t], line = this.winLine && this.winLine.team === t ? this.winLine.cells : [];
      let h = [...'BINGO'].map(l => `<div class="l">${l}</div>`).join('');
      for (let r = 0; r < 5; r++) for (let k = 0; k < 5; k++) {
        const v = c.n[r][k], mk = c.m[r][k];
        const hot = !mk && rec.includes(v) && !this.over;
        const inLine = line.some(([a, b]) => a === r && b === k);
        h += `<div class="${mk ? 'm' : ''} ${hot ? 'hot' : ''} ${inLine ? 'line' : ''}">${v || '★'}</div>`;
      }
      return `<div class="bcard t-${t}"><h4>${TEAMS[t]}</h4><div class="bg5">${h}</div></div>`;
    }).join('');
  },
  lineOf(m) {
    const L = [];
    for (let i = 0; i < 5; i++) { L.push([0, 1, 2, 3, 4].map(k => [i, k])); L.push([0, 1, 2, 3, 4].map(k => [k, i])); }
    L.push([0, 1, 2, 3, 4].map(k => [k, k])); L.push([0, 1, 2, 3, 4].map(k => [k, 4 - k]));
    return L.find(cells => cells.every(([r, k]) => m[r][k])) || null;
  },
  say(t) { const m = $('#bMsg'); if (m) m.textContent = t; },
  onMsg(u, text, n) {
    if (this.over || !/^\d{1,2}$/.test(n)) return;
    const num = +n; if (num < 1 || num > 75 || !this.recentSet().includes(num)) return;
    const t = teamOf(u), c = this.cards[t];
    let pos = null;
    c.n.forEach((row, r) => row.forEach((v, k) => { if (v === num) pos = [r, k]; }));
    if (!pos || c.m[pos[0]][pos[1]]) return;
    c.m[pos[0]][pos[1]] = true;
    award(u, 3);
    const line = this.lineOf(c.m);
    if (line) {
      this.over = true; this.pause = Date.now() + 5000; this.winLine = { team: t, cells: line };
      award(u, 15); this.forced = t;
      this.say(`BINGO! ${u.name} completou a linha do ${TEAMS[t]}!`);
    } else this.say(`${u.name} marcou ${this.letter(num)}${num} para o ${TEAMS[t]}.`);
    this.draw();
  },
  tick(now) {
    if (this.pause) { if (now >= this.pause) finishGame(this.forced, 'Linha completa na cartela.'); return; }
    if (now < this.nextDraw) return;
    if (!this.pool.length) {
      const cnt = t => this.cards[t].m.flat().filter(Boolean).length;
      this.over = true; this.pause = now + 3000; this.forced = cnt('azul') > cnt('verde') ? 'azul' : cnt('verde') > cnt('azul') ? 'verde' : null;
      this.say('Acabaram os números. Vence quem marcou mais.'); return;
    }
    const n = this.pool.pop(); this.drawn.push(n); this.nextDraw = now + this.EVERY;
    this.draw();
  },
  sim() {
    if (this.over || !this.drawn.length) return null;
    return Math.random() < .75 ? String(rand(this.recentSet())) : String(1 + Math.floor(Math.random() * 75));
  }
};

  start() { this.round = 0; this.deck = shuffle(this.places).slice(0, this.ROUNDS); this.next(); },
  next() {
    this.cur = this.deck[this.round];
    Object.assign(this, { t0: Date.now(), over: false, pause: 0, stageIdx: 0 });
    const [, , lat, lon] = this.cur;
    const polys = this.land.map(p => `<polygon class="land" points="${p.map(([x, y]) => (x + 180) + ',' + (90 - y)).join(' ')}"/>`).join('');
    let grid = '';
    for (let x = 0; x <= 360; x += 30) grid += `<line class="gl" x1="${x}" y1="0" x2="${x}" y2="180"/>`;
    for (let y = 0; y <= 180; y += 30) grid += `<line class="gl" x1="0" y1="${y}" x2="360" y2="${y}"/>`;
    stage.innerHTML = `
      <div class="eyebrow">Lugar ${this.round + 1} de ${this.ROUNDS}</div>
      <h2 class="big" style="font-size:clamp(24px,3vw,36px)">Em que país fica?</h2>
      <div class="ggrid">
        <svg class="map" viewBox="0 0 360 180" aria-label="Mapa-múndi">${grid}${polys}
          <g id="gDot" style="display:none"><circle cx="${lon + 180}" cy="${90 - lat}" r="3"/><circle class="ring" cx="${lon + 180}" cy="${90 - lat}" r="3"/></g>
        </svg>
        <ul class="hints" id="gHints"></ul>
      </div>
      <div class="timer"><i id="gTimer"></i></div>
      <div class="msg" id="gMsg">Escreva o nome do país no chat.</div>`;
    this.hints();
  },
  hints() {
    const h = this.cur[4], labels = ['Região', 'Idioma e cultura', 'Capital', 'Ponto turístico'];
    $('#gHints').innerHTML = h.map((t, i) => i <= this.stageIdx || this.over
      ? `<li><small>${labels[i]} · ${this.POINTS[i]} pts</small>${esc(t)}</li>`
      : `<li class="off"><small>${labels[i]}</small>Chega em ${Math.max(0, Math.ceil((i * this.STEP_MS - (Date.now() - this.t0)) / 1000))}s</li>`).join('');
    $("#gDot").style.display = (this.stageIdx >= 2 || this.over) ? "" : "none";
  },
  match(n) {
    return this.cur[1].some(a => new RegExp('(^|[^a-z])' + a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z]|$)').test(n));
  },
  onMsg(u, text, n) {
    if (this.over || !this.match(n)) return;
    const pts = this.POINTS[this.stageIdx], t = award(u, pts);
    this.over = true; this.pause = Date.now() + 5000; this.hints();
    $('#gMsg').textContent = `${u.name} acertou: ${this.cur[0]}! +${pts} para o ${TEAMS[t]}.`;
  },
  tick(now) {
    if (this.pause) { if (now >= this.pause) { ++this.round < this.ROUNDS ? this.next() : finishGame(); } return; }
    const total = this.STEP_MS * 4;
    $('#gTimer').style.width = Math.max(0, (total - (now - this.t0)) / total * 100) + '%';
    const idx = Math.min(3, Math.floor((now - this.t0) / this.STEP_MS));
    if (idx !== this.stageIdx) this.stageIdx = idx;
    if (now - this.t0 >= total) {
      this.over = true; this.pause = now + 4500; this.hints();
      $('#gMsg').textContent = `Ninguém acertou. A resposta era ${this.cur[0]}.`; return;
    }
    this.hints();
  },
  sim() {
    if (this.over) return null;
    const right = this.stageIdx >= 1 && Math.random() < .12;
    return right ? this.cur[1][0] : rand(['brasil', 'china', 'franca', 'japao', 'egito', 'italia', 'peru']);
  }
};

    Object.values(this.ans).forEach(a => c[a.i]++);
    const max = Math.max(1, ...c);
    stage.querySelectorAll('.to').forEach(el => {
      const i = +el.dataset.i;
      el.querySelector('b').textContent = c[i];
      el.querySelector('i').style.width = (c[i] / max * 100) + '%';

    });

    const k = u.name.toLowerCase(); if (this.ans[k]) return;
    const i = isNaN(m[1]) ? 'abcd'.indexOf(m[1]) : (+m[1] - 1);
    this.ans[k] = { i, u, at: Date.now() };
    teamOf(u); this.paint();
  },

    this.over = true; this.pause = Date.now() + 5000;
    const win = Object.values(this.ans).filter(a => a.i === this.right).sort((x, y) => x.at - y.at);
    win.forEach((a, idx) => award(a.u, idx === 0 ? 6 : 3));
    this.paint();
    $('#tMsg').textContent = win.length
      ? `Resposta: ${this.ok}. ${win.length} acertaram e ${win[0].u.name} foi o mais rápido (+6).`
      : `Resposta: ${this.ok}. Ninguém acertou.`;

    if (this.pause) { if (now >= this.pause) { ++this.round < this.ROUNDS ? this.next() : finishGame(); } return; }

  },
